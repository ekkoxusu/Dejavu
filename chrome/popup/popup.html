<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body { font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; width: 230px; margin: 0; padding: 14px; }
    h1 { font-size: 14px; margin: 0 0 2px; display: flex; align-items: center; gap: 6px; }
    h1 img { width: 18px; height: 18px; }
    .slogan { color: #6e7781; font-size: 12px; margin: 0 0 10px; }
    button { width: 100%; font: inherit; padding: 7px 0; border-radius: 6px; border: 1px solid #4f46e5; background: #4f46e5; color: #fff; cursor: pointer; }
    .tip { color: #6e7781; font-size: 11px; margin: 8px 0 0; text-align: center; }
  </style>
</head>
<body>
  <h1><img src="../icons/icon48.png" alt="">Dejavu</h1>
  <p class="slogan">录一次，AI 处处复现</p>
  <button id="open-btn">打开侧边栏</button>
  <p class="tip">建议将图标固定到工具栏 📌</p>
  <script src="popup.js"></script>
</body>
</html>
